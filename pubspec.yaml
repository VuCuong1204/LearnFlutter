name: learn_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  connectivity_plus: ^6.0.5
  flutter_svg: ^2.2.2 
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^10.1.1
  path_provider:
  dartz: ^0.10.1
  get_it: ^9.0.5
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_gen_runner: ^5.12.0
  build_runner: ^2.4.7

flutter_gen:
  output: lib/generated_resources/
  line_length: 120
  integrations:
    flutter_svg: true
  assets:
    enabled: true
    outputs:
      class_name: AppImages
      package_parameter_enabled: false
      style: dot-delimiter
  colors:
    enabled: true
    outputs:
      class_name: AppColors
    inputs:
      - lib/resources/app_color.xml
  fonts:
    enabled: true
    outputs:
      class_name: AppFontFamily

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/vectors/

fonts:
    - family: Roboto
      fonts:
        - asset: lib/resources/fonts/Roboto-Regular.ttf
        - asset: lib/resources/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: lib/resources/fonts/Roboto-Light.ttf
          weight: 300
        - asset: lib/resources/fonts/Roboto-Italic.ttf
          style: italic
        - asset: lib/resources/fonts/Roboto-Bold.ttf
          weight: 700

scripts:
  watch: "dart run build_runner watch"
  
flutter_intl:
  enabled: true