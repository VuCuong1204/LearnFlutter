name: learn_app
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  json_annotation: ^4.8.0
  auto_route: ^7.8.4
  dio: ^5.4.0
  connectivity_plus: ^6.0.5
  freezed_annotation: ^2.4.1
  flutter_svg: ^2.0.9
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_gen_runner: ^5.4.0
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  json_serializable: ^6.6.0
  custom_lint: ^0.6.4
  auto_route_generator: ^7.3.2
  freezed: ^2.4.6

flutter_gen:
  output: lib/generated_resources/
  line_length: 120
  integrations:
    flutter_svg: true
  assets:
    enabled: true
    outputs:
      class_name: AppImages
      package_parameter_enabled: false
      style: dot-delimiter
  colors:
    enabled: true
    outputs:
      class_name: AppColors
    inputs:
      - lib/resources/app_color.xml
  fonts:
    enabled: true
    outputs:
      class_name: AppFontFamily

flutter:
  uses-material-design: true
  assets:
    - assets/images/

fonts:
    - family: Roboto
      fonts:
        - asset: lib/resources/fonts/Roboto-Regular.ttf
        - asset: lib/resources/fonts/Roboto-Medium.ttf
          weight: 500
        - asset: lib/resources/fonts/Roboto-Light.ttf
          weight: 300
        - asset: lib/resources/fonts/Roboto-Italic.ttf
          style: italic
        - asset: lib/resources/fonts/Roboto-Bold.ttf
          weight: 700

scripts:
  watch: "dart run build_runner watch"
  
flutter_intl:
  enabled: true